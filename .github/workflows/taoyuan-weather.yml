name: Taoyuan Weather

on:
  workflow_dispatch:
    inputs:
      input_date:
        description: "預報日期 YYYY-MM-DD，留空使用台灣今天"
        required: false
        default: ""
      input_locations:
        description: "行政區，逗號分隔；留空代表桃園13區"
        required: false
        default: ""
      send_telegram:
        description: "是否推送 Telegram"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  schedule:
    - cron: "0 23 * * *"

jobs:
  weather:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check project files
        run: |
          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Project:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Install dependencies
        run: npm ci

      - name: Run weather
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          INPUT_DATE: ${{ inputs.input_date }}
          INPUT_LOCATIONS: ${{ inputs.input_locations }}
          SEND_TELEGRAM: ${{ inputs.send_telegram || 'true' }}

        run: npm run weather
